# Image de production : SPA servie par nginx (cf. Dockerfile, étape prod).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Fichiers générés par Vite : nom haché par contenu, donc cachables indéfiniment.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Point d'entrée : toujours revalidé, sinon un déploiement pointerait vers des assets disparus.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Routes du front (/connexion, /service…) : repli sur index.html, le routeur prend le relais.
  location / {
    try_files $uri /index.html;
  }
}
