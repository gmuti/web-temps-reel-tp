services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-restaurant}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-restaurant}?schema=public
      PORT: ${API_PORT:-3001}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'
    volumes:
      - ./apps/api:/app/apps/api
      - ./shared:/app/shared
      - api-root-node-modules:/app/node_modules
      - api-node-modules:/app/apps/api/node_modules
      - api-shared-node-modules:/app/shared/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      - ./apps/web:/app/apps/web
      - ./shared:/app/shared
      - web-root-node-modules:/app/node_modules
      - web-node-modules:/app/apps/web/node_modules
      - web-shared-node-modules:/app/shared/node_modules

volumes:
  postgres-data:
  api-root-node-modules:
  api-node-modules:
  api-shared-node-modules:
  web-root-node-modules:
  web-node-modules:
  web-shared-node-modules:
